# Prompt Bench Configuration
# This file contains default values for CLI options to reduce repetitive command-line arguments
#
# Usage:
# - Set defaults below to avoid typing common flags
# - CLI flags will override these defaults
# - File is optional - commands work without it

[defaults]
# Default template slug for run/test commands
template = "multi-angle-hybrid"

# Default batch file path for run/test commands (relative to project root)
batch_file = "prompt-bench/fixtures/images-batch-uniform.json"

# Default label prefix for batches (timestamp will be appended)
label_prefix = "batch"

# Default model for evaluate command
evaluation_model = "claude-sonnet-4-20250514"
analysis_model = "gemini-2.0-flash"

# Default model for AI-powered template improvement
improvement_model = "claude-sonnet-4-20250514"

# Default baseline label for report/compare commands
baseline_label = ""

# Default settings for report command
[defaults.report]
# Generate AI insights by default
insights = true
# Show image URLs in report output
show_urls = false

[defaults.analysis]

enabled = true

cache_enabled = true

prompt_slug = "product-analysis"

# Default settings for improve command
[defaults.improve]
# Template slug to improve (uses defaults.template if not set)
template = "ecommerce-base"
# Batch file for testing (uses defaults.batch_file if not set)
# Use uniform variables to get clear signal on template structure issues
batch_file = "prompt-bench/fixtures/images-batch-uniform.json"
# Maximum number of iterations before stopping
max_iterations = 5
# Target mean score to stop at (0 = no target)
target_score = 9.0
# Auto-approve changes without confirmation (false = ask for approval)
auto_approve = false
# Save improved templates as new versions (true) or overwrite original (false)
version_templates = true
# Model to use for AI analysis and code generation
ai_model = "claude-sonnet-4-20250514"

